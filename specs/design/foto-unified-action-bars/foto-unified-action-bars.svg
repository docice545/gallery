<rect x="55" y="549" width="850" height="74" rx="37" fill="#e6e4e9"/>
<g font-family="Arial" font-size="13" text-anchor="middle"><g color="#25232b"><use href="#share" x="180" y="556"/><use href="#add" x="372" y="556"/><use href="#move" x="564" y="556"/></g><g color="#c92b35"><use href="#trash" x="756" y="556"/></g><text x="192" y="603" fill="#25232b">Отправить</text><text x="384" y="603" fill="#25232b">Добавить</text><text x="576" y="603" fill="#25232b">Переместить</text><text x="768" y="603" fill="#c92b35">Удалить</text></g>
<text x="55" y="675" font-family="Arial" font-size="16" fill="#d7d6e1">Тёмная тема · тот же силуэт</text>
<rect x="55" y="692" width="850" height="67" rx="33.5" fill="#34343b" stroke="#565661"/>
<g font-family="Arial" font-size="13" text-anchor="middle"><g color="#f0f0f4"><use href="#share" x="124" y="697"/><use href="#edit" x="291" y="697"/><use href="#add" x="459" y="697"/><use href="#lens" x="626" y="697"/></g><g color="#ff7079"><use href="#trash" x="793" y="697"/></g><text x="136" y="746" fill="#f0f0f4">Отправить</text><text x="303" y="746" fill="#f0f0f4">Изменить</text><text x="471" y="746" fill="#f0f0f4">Добавить</text><text x="638" y="746" fill="#f0f0f4">Объектив</text><text x="805" y="746" fill="#ff7079">Удалить</text></g>
