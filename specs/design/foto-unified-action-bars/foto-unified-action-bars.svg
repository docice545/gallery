<g font-family="Arial" font-size="13" text-anchor="middle"><g color="#25232b"><use href="#restore" x="338" y="412"/></g><g color="#c92b35"><use href="#trash" x="598" y="412"/></g><text x="350" y="459" fill="#25232b">Восстановить</text><text x="610" y="459" fill="#c92b35">Удалить навсегда</text></g>
