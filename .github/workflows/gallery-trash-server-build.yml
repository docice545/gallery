name: Gallery Trash Server Artifact Only

# No registry publishing, release/production credentials, SSH or deployment.
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: 'Optional full approved source SHA; must be an ancestor with identical application/build inputs. Tooling fixes may differ.'
        type: string
        required: false
        default: ''

permissions:
  contents: read
  packages: read

jobs:
  build:
    if: github.repository == 'docice545/gallery'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare existing branding dependencies (isolated runner)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y jq imagemagick
      - name: Build existing server Dockerfile and export image
        env:
          EXPECTED_SHA: ${{ inputs.source_commit || github.sha }}
        run: scripts/release/server_build.sh "$EXPECTED_SHA" "$RUNNER_TEMP/gallery-server-artifact"
      # The pinned disposable PostgreSQL fixture is public on GHCR. Anonymous
      # pulls from shared runner addresses hit the registry's rate limit.
      # Use only this job's read-only token; login-action logs out after the job.
      - name: Authenticate read-only GHCR fixture pull
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Fresh disposable PostgreSQL/Redis HTTP Trash and Restore smoke test
        env:
          GALLERY_ISOLATED_CI: '1'
          EXPECTED_SHA: ${{ inputs.source_commit || github.sha }}
        run: python3 scripts/release/server_artifact_smoke.py "$EXPECTED_SHA" "$RUNNER_TEMP/gallery-server-artifact"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gallery-trash-server-linux-amd64
          path: ${{ runner.temp }}/gallery-server-artifact/
          if-no-files-found: error
          retention-days: 14
