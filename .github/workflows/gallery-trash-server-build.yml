name: Gallery Trash Server Artifact Only

# No registry, release, production credentials, SSH or deployment.
on:
  push:
    branches: ['candidate/gallery-trash-*']
    paths:
      - 'server/**'
      - 'scripts/release/server_build.sh'
      - 'scripts/release/server_artifact_smoke.py'
      - '.github/workflows/gallery-trash-server-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'docice545/gallery'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Prepare existing branding dependencies (isolated runner)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y jq imagemagick
      - name: Build existing server Dockerfile and export image
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: scripts/release/server_build.sh "$EXPECTED_SHA" "$RUNNER_TEMP/gallery-server-artifact"
      - name: Fresh disposable PostgreSQL/Redis HTTP Trash and Restore smoke test
        env:
          GALLERY_ISOLATED_CI: '1'
          EXPECTED_SHA: ${{ github.sha }}
        run: python3 scripts/release/server_artifact_smoke.py "$EXPECTED_SHA" "$RUNNER_TEMP/gallery-server-artifact"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gallery-trash-server-linux-amd64
          path: ${{ runner.temp }}/gallery-server-artifact/
          if-no-files-found: error
          retention-days: 14
