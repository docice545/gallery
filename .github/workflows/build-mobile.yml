name: Build Mobile

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
      environment:
        description: 'Target environment'
        required: true
        default: 'development'
        type: string
      ios_release:
        description: 'Explicit signing and TestFlight gate; default is unsigned compilation.'
        required: false
        default: false
        type: boolean
      android_release:
        description: 'Explicit trusted-host Android signing; never enabled by PR or push.'
        required: false
        default: false
        type: boolean
    secrets:
      KEY_JKS:
        required: false
      ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
      ANDROID_STORE_PASSWORD:
        required: false
      APP_STORE_CONNECT_API_KEY_ID:
        required: false
      APP_STORE_CONNECT_API_KEY_ISSUER_ID:
        required: false
      APP_STORE_CONNECT_API_KEY:
        required: false
      IOS_CERTIFICATE_P12:
        required: false
      IOS_CERTIFICATE_PASSWORD:
        required: false
      FASTLANE_TEAM_ID:
        required: false
  pull_request:
  push:
    # The audit branch can collect hosted evidence before GitHub API access is
    # available to open its PR. Push events cannot enter either signing path.
    branches:
      [
        main,
        'release/*',
        codex/issue18-cross-platform-audit,
        codex/issue17-smart-timeline,
        codex/issue18-backend-contract-rating,
      ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  DEPLOY: ${{ inputs.environment == 'production' || github.ref == 'refs/heads/main' }}

jobs:
  pre-job:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check what should run
        id: check
        uses: immich-app/devtools/actions/pre-job@75493d49052d536863fc96100086782c5279b145 # pre-job-action-v2.1.1
        with:
          github-token: ${{ github.token }}
          filters: |
            mobile:
              - 'mobile/**'
              - 'open-api/**'
          force-filters: |
            - '.github/workflows/build-mobile.yml'
          # Release evidence must execute full checks even on version/docs-only pushes.
          force-events: 'workflow_call,workflow_dispatch,push'

  flutter-tests:
    name: Flutter tests and coverage
    needs: pre-job
    if: ${{ fromJSON(needs.pre-job.outputs.should_run).mobile == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          token: ${{ github.token }}

      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@06a9ef925332c91be647d6256642b86b398592c8 # use-mise-action-v3.2.1
        with:
          github_token: ${{ github.token }}
          working_directory: ./mobile

      - name: Install dependencies
        id: flutter-install
        run: |
          set -o pipefail
          mise //mobile:install:ci 2>&1 | tee "$RUNNER_TEMP/flutter-install.log"

      - name: Annotate Flutter dependency setup failure
        if: failure() && steps.flutter-install.outcome == 'failure'
        run: python3 .github/scripts/report-ci-failures.py setup "$RUNNER_TEMP/flutter-install.log"

      - name: Perform codegen
        id: codegen
        run: |
          set -o pipefail
          mise //mobile:codegen 2>&1 | tee "$RUNNER_TEMP/flutter-codegen.log"

      - name: Annotate Flutter code generation failure
        if: failure() && steps.codegen.outcome == 'failure'
        run: python3 .github/scripts/report-ci-failures.py setup "$RUNNER_TEMP/flutter-codegen.log"

      - name: Previously failed Flutter cases and current device-only action contracts
        id: focused-flutter
        working-directory: ./mobile
        run: |
          set -o pipefail
          flutter test --no-pub --concurrency=1 --reporter json \
            test/presentation/widgets/asset_viewer/timeline_video_viewer_test.dart \
            test/presentation/widgets/timeline/dense_timeline_overlays_test.dart \
            test/presentation/widgets/timeline/justified_timeline_widget_test.dart \
            test/utils_legacy/action_button_utils_test.dart \
            test/unit/presentation/actions/delete_action_test.dart \
            2>&1 | tee "$RUNNER_TEMP/flutter-focused.jsonl"

      - name: Annotate focused Flutter failures
        if: failure() && steps.focused-flutter.outcome == 'failure'
        run: python3 .github/scripts/report-ci-failures.py flutter "$RUNNER_TEMP/flutter-focused.jsonl"

      - name: Run Flutter tests with coverage
        id: full-flutter
        # Keep the full suite even when focused diagnostics find a failure.
        if: ${{ !cancelled() && steps.codegen.outcome == 'success' }}
        working-directory: ./mobile
        run: |
          set -o pipefail
          flutter test --coverage --reporter json 2>&1 | tee "$RUNNER_TEMP/flutter-tests.jsonl"

      - name: Annotate Flutter failures
        if: failure() && steps.full-flutter.outcome == 'failure'
        run: python3 .github/scripts/report-ci-failures.py flutter "$RUNNER_TEMP/flutter-tests.jsonl"

      - name: Upload Flutter coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flutter-test-coverage
          path: mobile/coverage/
          if-no-files-found: warn

  live-photo-timeline:
    # No changed-file filter: navigation, selection, animation and build changes
    # must retain the same required check on every PR and main/release push.
    name: Live Photo timeline non-regression
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: immich-app/devtools/actions/use-mise@06a9ef925332c91be647d6256642b86b398592c8 # use-mise-action-v3.2.1
        with:
          github_token: ${{ github.token }}
          working_directory: ./mobile
      - name: Frozen packages and code generation
        run: mise //mobile:install:ci && mise //mobile:codegen
      - name: Cold start, visibility, selection, lifecycle and native position contracts
        run: |
          set -o pipefail
          bash mobile/scripts/live_photo_regressions.sh 2>&1 | tee "$RUNNER_TEMP/live-photo-regressions.log"
      - name: Retain gate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-photo-regressions
          path: ${{ runner.temp }}/live-photo-regressions.log
          if-no-files-found: warn

  live-photo-native:
    name: Live Photo native decoded motion
    needs: live-photo-timeline
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: immich-app/devtools/actions/use-mise@06a9ef925332c91be647d6256642b86b398592c8 # use-mise-action-v3.2.1
        with:
          github_token: ${{ github.token }}
          working_directory: ./mobile
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Locked native media code generation
        run: bash mobile/scripts/android_media_codegen.sh
      - name: Enable hosted emulator acceleration
        run: |
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Actual ExoPlayer, authenticated synthetic media and decoded position
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: false
          working-directory: mobile
          script: bash scripts/android_native_motion_test.sh
      - name: Retain native gate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-photo-native-motion
          path: ${{ runner.temp }}/gallery-native-motion-test.log
          if-no-files-found: warn

  release-tooling-checks:
    name: Release artifact and provenance checks
    needs: pre-job
    if: ${{ fromJSON(needs.pre-job.outputs.should_run).mobile == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The Build 35 migration inventory test checks ancestry and source bytes.
          fetch-depth: 0
      - name: Isolated Python fixture dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/foto-ci-tools"
          "$RUNNER_TEMP/foto-ci-tools/bin/pip" install PyYAML==6.0.3
          echo "$RUNNER_TEMP/foto-ci-tools/bin" >> "$GITHUB_PATH"
      - run: python3 -m unittest discover -s mobile/scripts/tests -v
      - run: python3 -m unittest discover -s scripts/release/tests -v
      - run: python3 -m unittest discover -s tools/foto-automation/tests -p '*scope.py' -v

  build-unsigned-android:
    name: Unsigned universal Android (no device acceptance)
    # Compile independently so a test/VM startup failure cannot conceal an APK
    # compiler error. All test/native gates still fail the workflow and signing.
    needs: pre-job
    if: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && fromJSON(needs.pre-job.outputs.should_run).mobile == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Preserve source version and require a credentials-free workspace
        id: source
        run: |
          test ! -e mobile/android/key.jks
          test ! -e mobile/android/key.properties
          python3 - <<'PY'
          import os, pathlib, re
          source = pathlib.Path('mobile/pubspec.yaml').read_text()
          match = re.search(r'^version: (\d+\.\d+\.\d+)\+(\d+)$', source, re.M)
          if not match:
              raise SystemExit('Source mobile version/build is missing')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={match[1]}\nbuild={match[2]}\n')
          PY
      - uses: immich-app/devtools/actions/use-mise@06a9ef925332c91be647d6256642b86b398592c8 # use-mise-action-v3.2.1
        with:
          github_token: ${{ github.token }}
          working_directory: ./mobile
      - uses: ./.github/actions/apply-branding
        with:
          version: ${{ steps.source.outputs.version }}
          build_number: ${{ steps.source.outputs.build }}
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Frozen packages and generated clients
        run: mise //mobile:install:ci && mise //mobile:codegen
      - name: Build unsigned universal APK
        id: unsigned-apk
        working-directory: mobile
        env:
          VERSION_NAME: ${{ steps.source.outputs.version }}
          VERSION_CODE: ${{ steps.source.outputs.build }}
        run: |
          set -o pipefail
          test ! -e android/key.jks
          test ! -e android/key.properties
          # Same bounded resources as the native gate and reviewed HP builder.
          # Universal release Jetifier exhausted the previous 4 GiB heap.
          export GRADLE_OPTS="${GRADLE_OPTS:-} -Dorg.gradle.jvmargs=-Xmx6g -Dorg.gradle.workers.max=2 -Dorg.gradle.parallel=false"
          # Flutter 3.47 skips release plugin registration with --no-pub:
          # the dev integration_test Java entry survives but its release class
          # is excluded. Regenerate with the locked dependency graph instead.
          flutter build apk --release --pub \
            --target-platform android-arm,android-arm64,android-x64 \
            --build-name="$VERSION_NAME" --build-number="$VERSION_CODE" \
            2>&1 | tee "$RUNNER_TEMP/unsigned-apk-build.log"
          git diff --exit-code -- pubspec.lock
      - name: Expose unsigned build failure without signing credentials
        if: ${{ failure() && steps.unsigned-apk.outcome == 'failure' }}
        run: python3 .github/scripts/report-ci-failures.py android-build "$RUNNER_TEMP/unsigned-apk-build.log"
      - name: Verify actual APK and record source provenance
        env:
          VERSION_NAME: ${{ steps.source.outputs.version }}
          VERSION_CODE: ${{ steps.source.outputs.build }}
        run: |
          mkdir -p mobile/build/ci-unsigned
          cp mobile/build/app/outputs/flutter-apk/app-release.apk mobile/build/ci-unsigned/Foto-unsigned.apk
          python3 mobile/scripts/verify_unsigned_android.py \
            --apk mobile/build/ci-unsigned/Foto-unsigned.apk \
            --aapt "$ANDROID_HOME/build-tools/36.0.0/aapt" \
            --version "$VERSION_NAME" --build "$VERSION_CODE" \
            --expected-commit "$GITHUB_SHA" \
            --output mobile/build/ci-unsigned/manifest.json
      - name: Retain unsigned APK and receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-unsigned-universal
          path: mobile/build/ci-unsigned/
          if-no-files-found: error

  build-sign-android:
    name: Build and sign Android
    needs: [pre-job, flutter-tests, live-photo-timeline, live-photo-native]
    permissions:
      contents: read
      actions: read
      pull-requests: write
    # All PRs are untrusted build inputs; signing/HP runners are never part of PR validation.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.android_release == true && github.actor != 'dependabot[bot]' && fromJSON(needs.pre-job.outputs.should_run).mobile == true }}
    runs-on: mich

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          token: ${{ github.token }}

      - name: Require exact-source Live Photo CI before signing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 mobile/scripts/require_live_photo_ci.py \
            --repository "$GITHUB_REPOSITORY" --expected-commit "$(git rev-parse HEAD)"

      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@06a9ef925332c91be647d6256642b86b398592c8 # use-mise-action-v3.2.1
        with:
          github_token: ${{ github.token }}
          working_directory: ./mobile

      - uses: ./.github/actions/apply-branding

      - name: Create the Keystore
        if: ${{ !github.event.pull_request.head.repo.fork }}
        env:
          KEY_JKS: ${{ secrets.KEY_JKS }}
        working-directory: ./mobile
        run: printf "%s" $KEY_JKS | base64 -d > android/key.jks

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Restore Gradle Cache
        id: cache-gradle-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/sdk
            mobile/android/.gradle
          key: build-mobile-gradle-${{ runner.os }}-main

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: ''

      - name: Install dependencies
        run: mise //mobile:install:ci

      - name: Perform codegen
        run: mise //mobile:codegen

      - name: Build Android App Bundle
        working-directory: ./mobile
        env:
          ALIAS: ${{ secrets.ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ $DEPLOY == 'true' ]]; then
            flutter build apk --release
            flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64,android-x64
          else
            flutter build apk --release
          fi

      - name: Publish Android Artifact
        id: upload-apk
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-apk-signed
          path: mobile/build/app/outputs/flutter-apk/*.apk

      - name: Comment APK download link on PR
        if: ${{ github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork }}
        uses: immich-app/devtools/actions/sticky-comment@0135acd12ad9f3369b94a2aa3c0ae8c835a4e926 # sticky-comment-action-v1.0.0
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          APK_URL: ${{ steps.upload-apk.outputs.artifact-url }}
        with:
          id: mobile-android-apk
          token: ${{ github.token }}
          body: |
            📱 **Android release APK (universal)** — `${{ env.HEAD_SHA }}`

            Download: ${{ env.APK_URL }}

            <details>
              <summary>QR code</summary>
              <img src="https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=${{ env.APK_URL }}" alt="QR code" />
            </details>

            Installs as a separate app (applicationId `app.alextran.immich.pr${{ github.event.pull_request.number }}`), so it coexists with the Play Store version and any other PR builds.

      - name: Save Gradle Cache
        id: cache-gradle-save
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref == 'refs/heads/main'
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/sdk
            mobile/android/.gradle
          key: ${{ steps.cache-gradle-restore.outputs.cache-primary-key }}

  build-sign-ios:
    name: Verify or explicitly release iOS
    needs: [pre-job, live-photo-timeline, live-photo-native]
    permissions:
      contents: read
      actions: read
    # Run on main branch or workflow_dispatch, or on PRs/other branches (build only, no upload)
    if: ${{ (inputs.ios_release != true || github.event_name == 'workflow_dispatch') && (github.event_name != 'pull_request' || (github.head_ref != 'codex/foto-build17-editor' && github.head_ref != 'codex/foto-build17-dedup-acceptance' && github.head_ref != 'codex/foto-build17-release' && github.head_ref != 'codex/foto-build17-client-compat' && github.head_ref != 'codex/foto-build17-editor-compact')) && !github.event.pull_request.head.repo.fork && fromJSON(needs.pre-job.outputs.should_run).mobile == true }}
    runs-on: macos-26

    steps:
      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          token: ${{ github.token }}

      - name: Require exact-source Live Photo CI before signing
        if: inputs.ios_release == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 mobile/scripts/require_live_photo_ci.py \
            --repository "$GITHUB_REPOSITORY" --expected-commit "$(git rev-parse HEAD)"

      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@06a9ef925332c91be647d6256642b86b398592c8 # use-mise-action-v3.2.1
        with:
          github_token: ${{ github.token }}
          working_directory: ./mobile

      - name: Preserve committed iOS version and build through branding
        id: ios-source-meta
        run: |
          read -r app_version app_build <<< "$(awk -F'[ +]' '/^version:/ {print $2, $3}' mobile/pubspec.yaml)"
          [[ "$app_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$app_build" =~ ^[1-9][0-9]*$ ]]
          echo "version=$app_version" >> "$GITHUB_OUTPUT"
          echo "build=$app_build" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/apply-branding
        with:
          version: ${{ steps.ios-source-meta.outputs.version }}
          build_number: ${{ steps.ios-source-meta.outputs.build }}

      - name: Use CocoaPods for Flutter plugins
        run: mise exec -- flutter config --no-enable-swift-package-manager

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
          bundler-cache: true # zizmor: ignore[cache-poisoning] release branches cannot read caches written by pull requests
          working-directory: ./mobile/ios

      - name: Install dependencies
        if: inputs.ios_release == true
        run: mise //mobile:install:ci

      - name: Perform codegen
        if: inputs.ios_release == true
        run: mise //mobile:codegen

      - name: Resolve iOS Swift Packages
        if: inputs.ios_release == true
        working-directory: ./mobile
        run: flutter build ios --config-only --no-codesign

      - name: Create API Key
        if: inputs.ios_release == true
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        working-directory: ./mobile/ios
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$API_KEY_CONTENT" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8

      - name: Import Certificate
        if: inputs.ios_release == true
        env:
          IOS_CERTIFICATE_P12: ${{ secrets.IOS_CERTIFICATE_P12 }}
        working-directory: ./mobile/ios
        run: |
          # Decode certificate
          echo "$IOS_CERTIFICATE_P12" | base64 --decode > certificate.p12

      - name: Create keychain and import certificate
        if: inputs.ios_release == true
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        working-directory: ./mobile/ios
        run: |
          # Create keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

          # Import certificate
          security import certificate.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain

          # Verify certificate was imported
          security find-identity -v -p codesigning build.keychain

      - name: Build and deploy to TestFlight
        if: inputs.ios_release == true
        env:
          FASTLANE_TEAM_ID: ${{ secrets.FASTLANE_TEAM_ID }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_NAME: build.keychain
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          ENVIRONMENT: ${{ inputs.environment || 'development' }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 120
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: 6
        working-directory: ./mobile/ios
        run: |
          if [[ "$ENVIRONMENT" == "development" ]]; then
            bundle exec fastlane gha_testflight_dev
          else
            bundle exec fastlane gha_release_prod
          fi

      - name: Build iOS (no credentials or upload)
        if: inputs.ios_release != true
        working-directory: ./mobile
        run: bash scripts/ios_build_only.sh

      - name: Clean up keychain
        if: always() && inputs.ios_release == true
        run: |
          security delete-keychain build.keychain || true

      - name: Upload unsigned archive
        if: inputs.ios_release != true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-unsigned-archive
          path: mobile/build/ios/archive/Runner.xcarchive
          if-no-files-found: error

      - name: Upload unsigned IPA for user-side signing
        if: inputs.ios_release != true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-unsigned-ipa
          path: mobile/build/ios/ipa/Photos-unsigned.ipa
          if-no-files-found: error

      - name: Upload IPA artifact
        if: inputs.ios_release == true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-release-ipa
          path: mobile/build/ios/ipa/gallery.ipa
          if-no-files-found: error
