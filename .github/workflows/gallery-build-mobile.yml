name: Inspect exact SideStore failing IPA
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: docice545/gallery
          run-id: '37511542010'
          artifact-ids: '11436990368'
          path: inspection
      - name: Inspect actual IPA metadata and all Cyrillic name occurrences
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, plistlib, zipfile
          from pathlib import Path
          files = list(Path("inspection").rglob("*.ipa"))
          assert len(files) == 1, files
          ipa = files[0]
          report = {"source_run": 37511542010, "source_artifact": 11436990368,
                    "ipa_name": ipa.name, "ipa_sha256": hashlib.sha256(ipa.read_bytes()).hexdigest(),
                    "targets": [], "all_photo_name_occurrences": []}
          def exact_paths(value, prefix="$", found=None):
              if found is None: found = []
              if value == "Фото": found.append(prefix)
              elif isinstance(value, dict):
                  for key, item in value.items(): exact_paths(item, prefix + "." + str(key), found)
              elif isinstance(value, list):
                  for i, item in enumerate(value): exact_paths(item, prefix + "[" + str(i) + "]", found)
              return found
          with zipfile.ZipFile(ipa) as z:
              assert z.testzip() is None
              roots = [n for n in z.namelist() if n.startswith("Payload/") and n.endswith(".app/Info.plist") and n.count("/") == 2]
              assert len(roots) == 1, roots
              app = roots[0].removesuffix("Info.plist")
              for relative in ("Info.plist", "PlugIns/ShareExtension.appex/Info.plist", "PlugIns/WidgetExtension.appex/Info.plist"):
                  data = plistlib.loads(z.read(app + relative))
                  keys = ["CFBundleDisplayName", "CFBundleName", "CFBundleIdentifier", "CFBundleExecutable",
                          "CFBundleShortVersionString", "CFBundleVersion", "MinimumOSVersion", "AppGroupId",
                          "CFBundleDevelopmentRegion", "CFBundleLocalizations", "NSExtension", "BGTaskSchedulerPermittedIdentifiers"]
                  report["targets"].append({"path": app + relative, **{k:data[k] for k in keys if k in data}})
              for name in sorted(z.namelist()):
                  if name.endswith("/"): continue
                  raw = z.read(name)
                  counts = {enc:raw.count("Фото".encode(enc)) for enc in ("utf-8", "utf-16-le", "utf-16-be")}
                  matches = []
                  if name.endswith((".plist", ".strings")):
                      try: matches = exact_paths(plistlib.loads(raw))
                      except Exception: pass
                  elif name.endswith(".json"):
                      try: matches = exact_paths(json.loads(raw))
                      except Exception: pass
                  if any(counts.values()) or matches:
                      report["all_photo_name_occurrences"].append({"path":name, "literal_counts":counts, "exact_value_paths":matches})
          print("IOS_IPA_AUDIT_BEGIN")
          print(json.dumps(report, ensure_ascii=False, indent=2))
          print("IOS_IPA_AUDIT_END")
          PYTHON
