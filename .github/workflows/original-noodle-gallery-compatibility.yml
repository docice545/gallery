name: Original Noodle Gallery compatibility

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'server/**'
      - 'open-api/**'
      - 'mobile/**'
      - 'e2e/**'
      - 'tools/original-noodle-gallery/**'
      - 'server/test/contracts/original-noodle-gallery-compatibility.json'
      - '.github/workflows/original-noodle-gallery-compatibility.yml'
  push:
    branches: ['codex/foto-master-final-20261029']
    paths:
      - 'server/**'
      - 'open-api/**'
      - 'mobile/**'
      - 'e2e/**'
      - 'tools/original-noodle-gallery/**'
      - 'server/test/contracts/original-noodle-gallery-compatibility.json'
      - '.github/workflows/original-noodle-gallery-compatibility.yml'

permissions: {}

# Keep the expensive emulator and disposable-backend matrix bounded when small commits land.
concurrency:
  group: original-noodle-gallery-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every workflow-path checkpoint re-runs the complete matrix on that exact
# commit; historical receipts are never promoted to a newer SHA implicitly.

jobs:
  api-contract:
    name: API contract and compatibility regressions
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir server exec vitest run src/utils/client-contracts.spec.ts src/utils/original-noodle-gallery-contracts.spec.ts --config test/vitest.config.mjs
      - name: Start disposable backend dependencies
        run: |
          for attempt in 1 2 3; do
            docker compose -f e2e/docker-compose.yml pull --quiet database redis && \
              docker compose -f e2e/docker-compose.yml up -d database redis && break
            rc=$?
            if [[ $attempt -eq 3 ]]; then exit $rc; fi
            sleep $((attempt * 20))
          done
          for i in $(seq 1 60); do docker compose -f e2e/docker-compose.yml exec -T database pg_isready -U postgres -d immich && break; sleep 2; done
      - name: Build and start disposable FOTO backend
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            docker compose -f e2e/docker-compose.yml build immich-server && break
            rc=$?
            if [[ $attempt -eq 3 ]]; then exit $rc; fi
            sleep $((attempt * 20))
          done
          docker compose -f e2e/docker-compose.yml up -d immich-server
          for i in $(seq 1 90); do curl --fail --silent http://127.0.0.1:2285/api/server/ping && exit 0 || true; sleep 2; done
          docker compose -f e2e/docker-compose.yml logs immich-server
          exit 1
      - name: Seed disposable login account
        run: |
          curl --fail --silent -X POST http://127.0.0.1:2285/api/auth/admin-sign-up \
            -H 'content-type: application/json' \
            -d '{"email":"admin@immich.cloud","password":"password","name":"Admin"}'
      - name: Ensure API smoke media tool is available
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg imagemagick
          fi
      - name: Run disposable backend API smoke flows
        run: bash tools/original-noodle-gallery/api_smoke.sh http://127.0.0.1:2285
      - name: Upload contract receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: original-noodle-api-contract-receipts
          path: |
            server/test-results/**
            /tmp/noodle-api-smoke/**
          if-no-files-found: ignore
      - name: Tear down disposable services
        if: always()
        run: docker compose -f e2e/docker-compose.yml down -v

  android-emulator:
    name: Stock Android ${{ matrix.version }} emulator E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # The two official APKs exercise the same disposable backend and emulator
      # host. Keep them sequential so Docker pulls and KVM memory are bounded
      # without dropping either version from the release gate.
      max-parallel: 1
      matrix:
        version: ['5.8.0', '5.9.0']
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Download and verify official APK
        id: apk
        env:
          VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          case "$VERSION" in
            5.8.0) url='https://github.com/open-noodle/gallery/releases/download/v5.8.0/gallery-v5.8.0.apk'; sha='385cd0734530c943bbe09f7d651434d585fbc276c2523c3c5a0357a6e94c2cd0' ;;
            5.9.0) url='https://github.com/open-noodle/gallery/releases/download/v5.9.0/gallery-v5.9.0.apk'; sha='a00b7a4168449d5de77efb6d77294c7097721a038e8a5beff0a1a73d73ef7c9d' ;;
          esac
          curl --fail --location --retry 3 "$url" -o "gallery-v$VERSION.apk"
          echo "$sha  gallery-v$VERSION.apk" | sha256sum --check
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "gallery-v$VERSION.apk" | tee apk-signature.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' apk-signature.txt
          grep -q 'Signer #1 certificate SHA-256 digest: c1a77384cf726ba6ef0ac7ef51acd124e49941d123a2530615dd51a80c5b57c3' apk-signature.txt
          echo "path=$PWD/gallery-v$VERSION.apk" >> "$GITHUB_OUTPUT"
      - name: Start disposable PostgreSQL and Redis
        run: |
          for attempt in 1 2 3; do
            docker compose -f e2e/docker-compose.yml pull --quiet database redis && \
              docker compose -f e2e/docker-compose.yml up -d database redis && break
            rc=$?
            if [[ $attempt -eq 3 ]]; then exit $rc; fi
            sleep $((attempt * 20))
          done
          for i in $(seq 1 60); do docker compose -f e2e/docker-compose.yml exec -T database pg_isready -U postgres -d immich && break; sleep 2; done
      - name: Build and start disposable FOTO backend
        run: |
          for attempt in 1 2 3; do
            docker compose -f e2e/docker-compose.yml build immich-server && break
            rc=$?
            if [[ $attempt -eq 3 ]]; then exit $rc; fi
            sleep $((attempt * 20))
          done
          docker compose -f e2e/docker-compose.yml up -d immich-server
          for i in $(seq 1 90); do curl --fail --silent http://127.0.0.1:2285/api/server/ping && exit 0 || true; sleep 2; done
          docker compose -f e2e/docker-compose.yml logs immich-server
          exit 1
      - name: Seed disposable login account
        run: |
          curl --fail --silent -X POST http://127.0.0.1:2285/api/auth/admin-sign-up -H 'content-type: application/json' -d '{"email":"admin@immich.cloud","password":"password","name":"Admin"}'
      - name: Run official client on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          APK_PATH: ${{ steps.apk.outputs.path }}
          VERSION: ${{ matrix.version }}
          SERVER_URL: http://10.0.2.2:2285
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -memory 4096 -cores 2 -gpu swiftshader_indirect
          emulator-boot-timeout: 900
          force-avd-creation: true
          script: |
            mkdir -p /tmp/noodle-e2e
            bash tools/original-noodle-gallery/android_emulator_smoke.sh "$APK_PATH" "$VERSION" "$SERVER_URL"
      - name: Upload Android E2E evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: original-noodle-android-${{ matrix.version }}
          path: |
            apk-signature.txt
            /tmp/noodle-e2e/**
            /tmp/noodle-window.xml
            /tmp/noodle-monkey.log
      - name: Tear down disposable services
        if: always()
        run: docker compose -f e2e/docker-compose.yml down -v

  ios-contract:
    name: iOS source and simulator contract checks
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: immich-app/devtools/actions/use-mise@06a9ef925332c91be647d6256642b86b398592c8 # use-mise-action-v3.2.1
        with:
          github_token: ${{ github.token }}
          working_directory: ./mobile
      - name: Install pinned mobile dependencies and generated clients
        run: mise //mobile:install:ci && mise //mobile:codegen
      - name: Run iOS-capable Flutter analysis
        working-directory: mobile
        run: flutter analyze --no-pub
      - name: Run iOS-capable existing service and repository tests
        working-directory: mobile
        run: flutter test --no-pub test/services test/repositories
      - name: Run screenshot framing policy tests
        working-directory: mobile
        run: flutter test --no-pub test/presentation/widgets/images/thumbnail_framing_test.dart
      - name: Run rendered screenshot framing widget tests
        working-directory: mobile
        run: flutter test --no-pub test/presentation/widgets/images/thumbnail_face_framing_widget_test.dart
      - name: Run offline thumbnail warmup policy tests
        working-directory: mobile
        run: flutter test --no-pub test/domain/services/offline_thumbnail_warmup_test.dart
      - name: Run SQLite recovery fixture tests
        working-directory: mobile
        run: flutter test --no-pub test/data/db/sqlite_health_test.dart
      - name: Build unsigned iOS simulator app
        working-directory: mobile
        run: flutter build ios --simulator --no-codesign
      - name: Record iOS build receipt
        run: |
          xcodebuild -version
          test -d mobile/build/ios/iphonesimulator
          find mobile/build/ios/iphonesimulator -maxdepth 2 -type d -name '*.app' -print -quit | tee ios-simulator-app.txt
          test -s ios-simulator-app.txt

  android-offline-cache:
    name: Android durable thumbnail cache regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: immich-app/devtools/actions/use-mise@06a9ef925332c91be647d6256642b86b398592c8 # use-mise-action-v3.2.1
        with:
          github_token: ${{ github.token }}
          working_directory: ./mobile
      - name: Install mobile dependencies and generated clients
        run: mise //mobile:install:ci && mise //mobile:codegen
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: zulu
          java-version: '17'
      - name: Prepare the pinned Flutter Gradle wrapper
        working-directory: mobile/android
        run: |
          set -euo pipefail
          flutter_root=$(flutter --version --machine | python3 -c 'import json, sys; print(json.load(sys.stdin)["flutterRoot"])')
          wrapper="$flutter_root/bin/cache/artifacts/gradle_wrapper"
          if [[ ! -s "$wrapper/gradle/wrapper/gradle-wrapper.jar" ]]; then
            flutter precache --android
          fi
          test -s gradle/wrapper/gradle-wrapper.properties
          test -s "$wrapper/gradle/wrapper/gradle-wrapper.jar"
          install -m 755 "$wrapper/gradlew" gradlew
          install -m 644 "$wrapper/gradle/wrapper/gradle-wrapper.jar" gradle/wrapper/gradle-wrapper.jar
      - name: Run Android cache unit tests
        working-directory: mobile/android
        run: |
          ./gradlew --no-daemon :app:testDebugUnitTest \
            --tests 'app.alextran.immich.images.OfflineThumbnailCacheTest' \
            --tests 'app.alextran.immich.cloudmedia.CloudAdmissionPolicyTest' \
            --tests 'app.alextran.immich.cloudmedia.CloudMimeTest' \
            --tests 'app.alextran.immich.cloudmedia.CloudRangeReaderTest' \
            --console=plain

  foto-offline-emulator:
    name: FOTO Build 22 offline timeline emulator E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: immich-app/devtools/actions/use-mise@06a9ef925332c91be647d6256642b86b398592c8 # use-mise-action-v3.2.1
        with:
          github_token: ${{ github.token }}
          working_directory: ./mobile
      - name: Install mobile dependencies and generated clients
        run: mise //mobile:install:ci && mise //mobile:codegen
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: zulu
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Build final debug APK for emulator evidence
        working-directory: mobile
        # Keep this as a standalone retryable receipt: the prior hosted run
        # built the same APK, while a later runner failed before backend setup.
        run: |
          set -euo pipefail
          ram_mb=$(awk '/MemTotal/ {print int($2/1024)}' /proc/meminfo)
          cpu_count=$(nproc)
          echo "Runner memory: ${ram_mb} MiB; CPUs: ${cpu_count}"
          heap_mb=$((ram_mb * 45 / 100))
          if (( heap_mb < 4096 )); then heap_mb=4096; fi
          if (( heap_mb > 8192 )); then heap_mb=8192; fi
          export GRADLE_OPTS="-Dorg.gradle.jvmargs=-Xmx${heap_mb}m -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -Dorg.gradle.workers.max=2"
          # This receipt is deliberately x86_64-only for the hosted emulator.
          # Release workflows continue to build the universal/arm64 artifacts.
          flutter build apk --debug --no-tree-shake-icons --no-pub --target-platform android-x64
      - name: Start disposable PostgreSQL and Redis
        run: |
          for attempt in 1 2 3; do
            docker compose -f e2e/docker-compose.yml pull --quiet database redis && \
              docker compose -f e2e/docker-compose.yml up -d database redis && break
            rc=$?
            if [[ $attempt -eq 3 ]]; then exit $rc; fi
            sleep $((attempt * 20))
          done
          for i in $(seq 1 60); do docker compose -f e2e/docker-compose.yml exec -T database pg_isready -U postgres -d immich && break; sleep 2; done
      - name: Build and start disposable FOTO backend
        run: |
          for attempt in 1 2 3; do
            docker compose -f e2e/docker-compose.yml build immich-server && break
            rc=$?
            if [[ $attempt -eq 3 ]]; then exit $rc; fi
            sleep $((attempt * 20))
          done
          docker compose -f e2e/docker-compose.yml up -d immich-server
          for i in $(seq 1 90); do curl --fail --silent http://127.0.0.1:2285/api/server/ping && exit 0 || true; sleep 2; done
          docker compose -f e2e/docker-compose.yml logs immich-server
          exit 1
      - name: Seed account and edge-content fixture
        run: |
          set -euo pipefail
          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y imagemagick
          fi
          command -v convert
          base='http://127.0.0.1:2285/api'
          curl --fail --silent -X POST "$base/auth/admin-sign-up" -H 'content-type: application/json' \
            -d '{"email":"admin@immich.cloud","password":"password","name":"Admin"}'
          token=$(curl --fail --silent -X POST "$base/auth/login" -H 'content-type: application/json' \
            -d '{"email":"admin@immich.cloud","password":"password"}' | jq -r .accessToken)
          convert -size 1080x1920 xc:white -fill black -draw 'rectangle 100,30 980,210' \
            -fill blue -draw 'rectangle 100,1710 980,1890' /tmp/foto-edge.png
          for year in 2020 2024; do
            curl --fail --silent -X POST "$base/assets" -H "Authorization: Bearer $token" \
              -F 'assetData=@/tmp/foto-edge.png' -F "filename=Screenshot_edge-content-$year.png" \
              -F "fileCreatedAt=$year-01-01T00:00:00.000Z" -F "fileModifiedAt=$year-01-01T00:00:00.000Z"
          done
      - name: Run Build 22 offline emulator smoke
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          APK_PATH: ${{ github.workspace }}/mobile/build/app/outputs/flutter-apk/app-debug.apk
          PACKAGE_NAME: de.opennoodle.gallery.debug
          SERVER_URL: http://10.0.2.2:2285
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -memory 4096 -cores 2 -gpu swiftshader_indirect
          emulator-boot-timeout: 900
          force-avd-creation: true
          script: |
            bash tools/original-noodle-gallery/foto_offline_emulator_smoke.sh "$APK_PATH" debug "$SERVER_URL"
      - name: Upload FOTO offline evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foto-build22-offline-emulator
          path: /tmp/foto-offline-e2e/**
      - name: Tear down disposable services
        if: always()
        run: docker compose -f e2e/docker-compose.yml down -v

