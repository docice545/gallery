name: FOTO Build 22 web acceptance

on:
  workflow_dispatch:
  push:
    branches:
      - codex/foto-build22-resume-20261029
    paths:
      - 'web/**'
      - 'e2e/**'
      - 'server/**'
      - 'packages/sdk/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/foto-build22-web-acceptance.yml'

permissions: {}

concurrency:
  group: foto-build22-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-build-and-unit:
    name: Web build and focused unit tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @immich/sdk build
      - run: pnpm --filter immich-web run check:typescript
      - run: pnpm --filter immich-web run check:svelte
      - run: pnpm --filter immich-web run build
      - run: pnpm --filter immich-web test -- --run

  chromium-e2e:
    name: Chromium web E2E against disposable backend
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @immich/sdk build
      - name: Install Playwright Browsers
        working-directory: e2e
        run: pnpm exec playwright install chromium --only-shell
      - name: Reclaim runner disk before Docker build
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /
      - name: Authenticate GHCR pulls
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u github-actions --password-stdin
      - name: Start disposable backend
        working-directory: e2e
        run: docker compose up -d --build --renew-anon-volumes --force-recreate --remove-orphans --wait --wait-timeout 300
      - name: Wait for backend
        run: node .github/scripts/wait-for-url.mjs http://127.0.0.1:2285/api/server/ping
      - name: Run Chromium web E2E
        working-directory: e2e
        env:
          PLAYWRIGHT_DISABLE_WEBSERVER: true
        # This deterministic rendered-theme slice is auth-free and exercises the
        # real Chromium/browser/backend wiring without relying on a populated
        # fixture account. The broader suite remains in the repository's full
        # e2e workflow, which owns its fixture lifecycle.
        run: pnpm exec playwright test src/specs/web/reskin-computed.e2e-spec.ts --project=web
      - name: Archive Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foto-build22-chromium-web-e2e
          path: e2e/playwright-report/
          if-no-files-found: ignore
      - name: Capture backend logs
        if: always()
        working-directory: e2e
        run: docker compose logs --no-color > docker-compose-logs.txt 2>&1 || true
      - name: Archive backend logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foto-build22-chromium-backend-logs
          path: e2e/docker-compose-logs.txt
          if-no-files-found: ignore
      - name: Tear down disposable backend
        if: always()
        working-directory: e2e
        run: docker compose down -v --remove-orphans
