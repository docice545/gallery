name: Gallery frozen Trash artifact proof and handoff

# Reuses all three existing artifacts. No application build, signing or deploy.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  proof:
    if: github.repository == 'docice545/gallery'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Enforce unchanged application inputs
        run: |
          set -euo pipefail
          git diff --exit-code 6a558b554e26e8c0fc5bc5c99259a92e7ef26a56 HEAD -- server mobile web packages i18n branding package.json pnpm-lock.yaml pnpm-workspace.yaml patches .dockerignore
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          repository: docice545/gallery
          run-id: 37953392247
          artifact-ids: 11626603468
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/frozen/backend
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: docice545/gallery
          run-id: 37944044747
          artifact-ids: 11624073289
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/android-artifact
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: docice545/gallery
          run-id: 37936380827
          artifact-ids: 11618922989
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/frozen/ios
      - name: Stage the exact APK without rebuilding
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/frozen/android"
          mapfile -d '' inputs < <(find "$RUNNER_TEMP/android-artifact" -name app-release.apk -type f -print0)
          [[ ${#inputs[@]} == 1 ]]
          cp -- "${inputs[0]}" "$RUNNER_TEMP/frozen/android/app-release.apk"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt"
      - name: Identity and failure-injection fixtures on classic store
        env:
          GALLERY_DISPOSABLE_RELEASE_TESTS: '1'
        run: python3 -m unittest scripts.release.tests.test_trash_image_identity -v
      - name: Load pinned artifact on isolated runner classic store
        run: |
          set -euo pipefail
          printf '%s  %s\n' 29679cf72b40eea7513addd26979771a4b4ebba9fb5106926d87ee2c05395194 "$RUNNER_TEMP/frozen/backend/gallery-server-linux-amd64.tar.gz" | sha256sum --check
          docker load -i "$RUNNER_TEMP/frozen/backend/gallery-server-linux-amd64.tar.gz"
          python3 scripts/release/verify_frozen_bundle.py "$RUNNER_TEMP/frozen" "$RUNNER_TEMP/classic-release"
      - name: Enable containerd image store ONLY on this disposable Actions VM
        run: |
          set -euo pipefail
          sudo systemctl stop docker
          if [[ -f /etc/docker/daemon.json ]]; then sudo cp /etc/docker/daemon.json "$RUNNER_TEMP/runner-daemon-before.json"; else printf '{}\n' > "$RUNNER_TEMP/runner-daemon-before.json"; fi
          jq '.features["containerd-snapshotter"] = true' "$RUNNER_TEMP/runner-daemon-before.json" > "$RUNNER_TEMP/runner-containerd.json"
          sudo cp "$RUNNER_TEMP/runner-containerd.json" /etc/docker/daemon.json
          sudo systemctl start docker
          docker info --format '{{json .DriverStatus}}'
      - name: Verify legitimate different ID on containerd store
        env:
          GALLERY_DISPOSABLE_RELEASE_TESTS: '1'
        run: |
          set -euo pipefail
          python3 -m unittest scripts.release.tests.test_trash_image_identity -v
          docker load -i "$RUNNER_TEMP/frozen/backend/gallery-server-linux-amd64.tar.gz"
          python3 scripts/release/verify_frozen_bundle.py "$RUNNER_TEMP/frozen" "$RUNNER_TEMP/gallery-trash-5.7.2-8-frozen-handoff"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gallery-trash-5.7.2-8-frozen-handoff-${{ github.run_id }}
          path: ${{ runner.temp }}/gallery-trash-5.7.2-8-frozen-handoff/
          if-no-files-found: error
          retention-days: 14
